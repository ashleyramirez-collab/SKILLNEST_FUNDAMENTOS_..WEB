<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ashley Ramirez">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="static/css/style.css ">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Perfil</h1>
            <nav class="nav-links">
                <a href="#">Inicio</a>
                <a href="#" class="active">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button class="btn-logout">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <div class="dashboard-container">

        <main class="main-content">
            <div class="profile-card">
                <div class="banner-blue"></div>
                <div class="profile-avatar-container">
                    <i class="bi bi-person-fill avatar-icon"></i>
                </div>
                <div class="profile-info">
                    <h2>Jane Doe</h2>
                    <p class="location">Bergen, Noruega</p>
                    <p class="description">Desarrolladora Frontend</p>
                    <p class="skills">Conocimientos en HTML, CSS, JavaScript</p>
                    <a href="#" class="edit-profile-btn">
                        <i class="bi bi-gear-fill"></i> Editar perfil
                    </a>
                </div>
            </div>
        </main>

        <aside class="sidebar-content">

            <div class="side-card">
                <div class="side-card-header">
                    <h3>Solicitudes de conexión</h3>
                    <button class="btn-view-all">Ver todas</button>
                </div>
                <div class="connection-list">
                    <div class="connection-item">
                        <div class="user-meta">
                            <i class="bi bi-person-circle list-avatar"></i>
                            <span>Steve Jobs</span>
                        </div>
                        <div class="actions-icons">
                            <i class="bi bi-check-circle-fill accept-icon"></i>
                            <i class="bi bi-x-circle-fill reject-icon"></i>
                        </div>
                    </div>
                    <div class="connection-item">
                        <div class="user-meta">
                            <i class="bi bi-person-circle list-avatar"></i>
                            <span>Bill Gates</span>
                        </div>
                        <div class="actions-icons">
                            <i class="bi bi-check-circle-fill accept-icon"></i>
                            <i class="bi bi-x-circle-fill reject-icon"></i>
                        </div>
                    </div>
                </div>
            </div>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ashley Ramirez">
    <title>Tarjeta de Usuario - Lisa Simpson</title>
    <link rel="stylesheet" href="static/css/style.css ">
</head>
<body>

    <div class="card-container">
        <div class="profile-img-container">
            <img src="static/images/lisa.jpg" alt="Lisa Simpson">
        </div>
        
        <h2 class="user-name">Lisa Simpson</h2>
        <h3 class="user-role">Desarrolladora Web</h3>
        
        <p class="user-bio">
            Apasionada por el diseño web y la tecnología.<br>
            Siempre en busca de nuevos retos.
        </p>
        
        <div class="user-links">
            <a href="#" target="_blank">GitHub</a>
            <a href="#" target="_blank">LinkedIn</a>
        </div>
        
        <button class="btn-connect">Conectar</button>
    </div>

</body>
</html>
